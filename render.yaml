services:
  # ── EventWise FastAPI Backend ──────────────────────────────
  - type: web
    name: eventwise-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: eventwise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: 120
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: CORS_ORIGINS
        value: "https://eventwise.vercel.app,http://localhost:3000"

databases:
  # ── PostgreSQL Database with pgvector support ──────────────
  - name: eventwise-db
    region: oregon
    plan: standard
    postgresMajorVersion: "16"
