[project]
name = "eventwise"
version = "0.1.0"
description = "EventWise — GenAI-powered event planning assistant"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "EventWise Team" }]
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "asyncpg>=0.30,<1",
    "httpx>=0.27,<1",
    "openai>=1.30,<2",
    "python-jose[cryptography]>=3.3,<4",
    "passlib[bcrypt]>=1.7,<2",
    "python-multipart>=0.0.9",
    "pgvector>=0.3.0,<1",
    "slowapi>=0.1.10,<1",
    "langgraph>=0.2.0,<2",
    "bleach>=6.0.0",
    "pyotp>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5.0,<6",
    "aiosqlite>=0.20.0,<1",
    "httpx>=0.27,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3,<4",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "RUF001", "F841"]


[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
